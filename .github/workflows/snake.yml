name: Generate profile graphics

on:
  schedule:
    - cron: "17 4 * * *" # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v3 commit: third-party actions should not float on a tag.
      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0969DA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6EA8FE

      # snk runs as root in Docker and leaves dist/ owned by root (mode 0755).
      # The stats steps run as the runner user and fail with EACCES unless
      # ownership is handed back. A missing dist/ still fails this step.
      - name: Restore dist ownership
        run: sudo chown -R "$(id -u):$(id -g)" dist

      # github-readme-stats.vercel.app is paused (DEPLOYMENT_PAUSED). Generate
      # static cards here so the profile README does not depend on a public
      # Vercel instance at page-view time.
      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&card_width=420&bg_color=00000000&hide_border=true&text_bold=false&rank_icon=github&title_color=1F2328&icon_color=6E7781&text_color=424A53&ring_color=D0D7DE
          path: dist/github-stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&card_width=420&bg_color=00000000&hide_border=true&text_bold=false&rank_icon=github&title_color=E6EDF3&icon_color=8B949E&text_color=C9D1D9&ring_color=30363D
          path: dist/github-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
